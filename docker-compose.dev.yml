# Development services only (the app runs from the IDE):  docker compose -f docker-compose.dev.yml up -d
#   PostgreSQL  localhost:5433  (run the app with --spring.profiles.active=postgres)
#   Mailpit     SMTP localhost:1025, web UI http://localhost:8025 (every e-mail the flows send lands here)
#   S3Mock      S3 API on http://localhost:9090 (run files; the app creates the bucket "flow-files")
#   Kafka       localhost:9092 (single KRaft node; start the app with FLOWS_KAFKA_ENABLED=true)
# perf/compose.yaml is the tuned PostgreSQL for load tests; it uses the same port, so run one or the other.
services:
  postgres:
    image: postgres:17
    container_name: dynamic-reports-postgres
    environment:
      POSTGRES_DB: reports
      POSTGRES_USER: reports
      POSTGRES_PASSWORD: reports
    ports:
      - "5433:5432"
    volumes:
      - dynamic-reports-pgdata:/var/lib/postgresql/data

  # S3-compatible store for development (Apache-2.0). Production uses the company's S3.
  s3:
    image: adobe/s3mock:3.12.0
    container_name: dynamic-reports-s3
    ports:
      - "9090:9090"

  # Apache Kafka (Apache-2.0), one node in KRaft mode: no ZooKeeper
  kafka:
    image: apache/kafka:4.1.0
    container_name: dynamic-reports-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: dynamic-reports-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  dynamic-reports-pgdata:
