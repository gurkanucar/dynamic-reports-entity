# PostgreSQL instead of the in-memory H2 (perf/compose.yaml, perf/README.md):
#   java -jar target/dynamic-reports-entity-0.0.1-SNAPSHOT.jar --spring.profiles.active=postgres
spring.datasource.url=jdbc:postgresql://localhost:5433/reports?reWriteBatchedInserts=true
spring.datasource.username=reports
spring.datasource.password=reports
spring.datasource.hikari.maximum-pool-size=20

# Hibernate creates the tables and indexes once and keeps the data between restarts;
# the data is loaded with psql (perf/postgres-data.sql), not on every start.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.h2.console.enabled=false

# Fewer log lines while measuring (slow queries are still logged as WARN)
logging.level.com.gucardev.dynamicreportsentity.platform.reporting=INFO
