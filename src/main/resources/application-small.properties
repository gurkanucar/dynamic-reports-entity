# Only the small hand-written data set (no generated bulk rows).
spring.flyway.locations=classpath:db/migration/{vendor},classpath:db/seed/{vendor}/demo,classpath:db/seed/{vendor}/examples

# Kept on disk (./data), so what you create survives restarts. Start over: stop the app and delete ./data.
# DATABASE_URL=jdbc:h2:mem:datasets for a throw-away database.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/platform}
