spring.application.name=dynamic-reports-entity

spring.datasource.url=jdbc:h2:mem:reports
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Run data.sql after Hibernate has created the schema
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true

# Report guard rails (defaults shown)
reporting.default-page-size=50
reporting.max-page-size=500
reporting.query-timeout=30s
reporting.export-max-rows=100000
reporting.export-fetch-size=1000

# Logs the generated report SQL
logging.level.com.gucardev.dynamicreportsentity.reporting=DEBUG
