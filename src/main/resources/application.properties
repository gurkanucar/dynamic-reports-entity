spring.application.name=dynamic-reports-entity

spring.datasource.url=jdbc:h2:mem:datasets
spring.jpa.open-in-view=false
# The schema is Flyway's, one folder per module: db/migration/{vendor}/<module>/V<module range>_<n>__*.sql
# (events 50, datasets 100, assistant 110, notification 200, approval 300, flow 400, business modules 800+).
# Extracting a module = taking its folder along; Hibernate only checks that the mapping matches.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
# Demo data (H2 only): small hand-written set + ~800,000 generated rows (100k personnel).
# Small data only: --spring.profiles.active=small   (tests always use the small set)
spring.flyway.locations=classpath:db/migration/{vendor},classpath:db/seed/{vendor}/demo,classpath:db/seed/{vendor}/bulk,classpath:db/seed/{vendor}/examples

spring.h2.console.enabled=true

# Dataset guard rails (defaults shown)
datasets.default-page-size=200
datasets.max-page-size=5000
datasets.query-timeout=30s
datasets.export-max-rows=1000000
datasets.export-fetch-size=1000
datasets.slow-query-threshold=500ms

# Logs the generated dataset SQL
logging.level.com.gucardev.dynamicreportsentity.platform.dataset=DEBUG

# ---- Flows (/api/flows): scheduled datasets sent by e-mail ------------------------------------------------
# Every instance runs the engine; claims and leases in the database decide who runs which step.
flows.poll-interval=2s
flows.schedule-interval=15s
flows.lease=1m
# Dataset steps running at the same time per instance (keep well below spring.datasource.hikari.maximum-pool-size)
flows.heavy-slots=2
flows.light-slots=8
flows.heavy-timeout=10m
flows.dataset-max-rows=100000
flows.max-artifact-size=20MB
# Run files (dataset CSVs) are deleted from storage this long after they were made
flows.file-retention=7d
flows.cleanup-interval=1h
flows.max-attempts=3
flows.retry-backoff=30s
flows.min-schedule-interval=5m
notifications.mail.from=datasets@localhost
# Comma separated; empty = any domain. In production set the company's domain(s).
notifications.mail.allowed-recipient-domains=

# Links in e-mails (approval requests) point here
approvals.ui-base-url=${UI_BASE_URL:http://localhost:5173}
# Webhook steps may only call these hosts (exact, or *.example.com); empty = none
flows.webhook.allowed-hosts=${FLOWS_WEBHOOK_ALLOWED_HOSTS:localhost,127.0.0.1}
flows.webhook.max-payload-size=256KB
# Kafka triggers and publish steps (compose.yaml starts a broker on localhost:9092)
flows.kafka.enabled=${FLOWS_KAFKA_ENABLED:false}
flows.kafka.allowed-topics=${FLOWS_KAFKA_ALLOWED_TOPICS:flows.*}
flows.kafka.trigger-group-id=flow-triggers
flows.kafka.reconcile-interval=30s
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Files: any S3-compatible store. Development: S3Mock from compose.yaml. Production: the company's S3
# (e.g. Ceph RGW / OpenShift Data Foundation) via env, e.g. STORAGE_S3_ENDPOINT, STORAGE_S3_BUCKET,
# STORAGE_S3_ACCESS_KEY, STORAGE_S3_SECRET_KEY; no access key = default AWS credential chain.
storage.type=s3
storage.s3.endpoint=http://localhost:9090
storage.s3.region=us-east-1
storage.s3.bucket=flow-files
storage.s3.access-key=dev
storage.s3.secret-key=dev
storage.s3.path-style=true
storage.s3.create-bucket=true
# Downloads redirect to a presigned URL valid this long (false: streamed through the app)
storage.s3.presigned-downloads=true
storage.s3.presigned-url-ttl=5m

# Mail server: Mailpit for development (compose.yaml), web UI on http://localhost:8025
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
logging.level.com.gucardev.dynamicreportsentity.platform.flow=INFO

# Application modules are the packages annotated with @ApplicationModule, at any depth: business modules sit
# directly under the root package, shared capabilities (datasets, flow, storage) under "platform".
spring.modulith.detection-strategy=explicitly-annotated

# ---- Dataset assistant (/api/dataset-suggestions): AI builds dataset definitions ---------------------------
# Off by default. Only catalog metadata and the user's messages are sent to the model, never data rows.
# Any OpenAI-compatible API with tool calling (OpenRouter, vLLM, Ollama, ...). Keys only via environment.
assistant.enabled=${ASSISTANT_ENABLED:false}
assistant.base-url=${ASSISTANT_BASE_URL:https://openrouter.ai/api/v1}
assistant.api-key=${OPENROUTER_API_KEY:}
assistant.model=${ASSISTANT_MODEL:}
assistant.timeout=3m
assistant.max-iterations=6
assistant.max-concurrent=4

# ---- Browser sessions (POST /api/session): stored in the database, so every instance knows them ----------
spring.session.timeout=8h
spring.session.jdbc.initialize-schema=always
# Cookie PLATFORM_SESSION: HttpOnly, SameSite=Lax (SecurityConfiguration). Production behind HTTPS:
security.session-cookie.secure=false
