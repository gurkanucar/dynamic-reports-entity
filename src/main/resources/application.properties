spring.application.name=dynamic-reports-entity

spring.datasource.url=jdbc:h2:mem:reports
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Run the demo data after Hibernate has created the schema
spring.jpa.defer-datasource-initialization=true
# Small hand-written data set + ~800,000 generated rows (100k personnel).
# Small data only: --spring.profiles.active=small   (tests always use the small set)
spring.sql.init.data-locations=classpath:data.sql,classpath:data-bulk.sql

spring.h2.console.enabled=true

# Report guard rails (defaults shown)
reporting.default-page-size=200
reporting.max-page-size=5000
reporting.query-timeout=30s
reporting.export-max-rows=1000000
reporting.export-fetch-size=1000
reporting.slow-query-threshold=500ms
# Datasets (/api/datasets). Every app instance runs the scheduler; a database lease decides which
# instance refreshes a snapshot. A dead instance's refresh is taken over once its lease runs out.
reporting.dataset-scheduler-interval=PT1M
reporting.dataset-refresh-lease=2m
reporting.dataset-refresh-timeout=10m
reporting.dataset-max-rows=5000000

# Logs the generated report SQL
logging.level.com.gucardev.dynamicreportsentity.platform.reporting=DEBUG

# ---- Flows (/api/flows): scheduled reports sent by e-mail ------------------------------------------------
# Every instance runs the engine; claims and leases in the database decide who runs which step.
flows.poll-interval=2s
flows.schedule-interval=15s
flows.lease=1m
# Report steps running at the same time per instance (keep well below spring.datasource.hikari.maximum-pool-size)
flows.heavy-slots=2
flows.light-slots=8
flows.report-timeout=10m
flows.report-max-rows=100000
flows.max-artifact-size=20MB
# Run files (report CSVs) are deleted from storage this long after they were made
flows.file-retention=7d
flows.cleanup-interval=1h
flows.max-attempts=3
flows.retry-backoff=30s
flows.min-schedule-interval=5m
flows.mail.from=reports@localhost
# Comma separated; empty = any domain. In production set the company's domain(s).
flows.mail.allowed-recipient-domains=

# Files: any S3-compatible store. Development: S3Mock from compose.yaml. Production: the company's S3
# (e.g. Ceph RGW / OpenShift Data Foundation) via env, e.g. STORAGE_S3_ENDPOINT, STORAGE_S3_BUCKET,
# STORAGE_S3_ACCESS_KEY, STORAGE_S3_SECRET_KEY; no access key = default AWS credential chain.
storage.type=s3
storage.s3.endpoint=http://localhost:9090
storage.s3.region=us-east-1
storage.s3.bucket=flow-files
storage.s3.access-key=dev
storage.s3.secret-key=dev
storage.s3.path-style=true
storage.s3.create-bucket=true
# Downloads redirect to a presigned URL valid this long (false: streamed through the app)
storage.s3.presigned-downloads=true
storage.s3.presigned-url-ttl=5m

# Mail server: Mailpit for development (compose.yaml), web UI on http://localhost:8025
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
logging.level.com.gucardev.dynamicreportsentity.platform.flow=INFO

# Application modules are the packages annotated with @ApplicationModule, at any depth: business modules sit
# directly under the root package, shared capabilities (reporting, flow, storage) under "platform".
spring.modulith.detection-strategy=explicitly-annotated
