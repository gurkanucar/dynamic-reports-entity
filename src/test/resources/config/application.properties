# Tests assert exact numbers, so they only load the small hand-written data set.
# (classpath:/config/application.properties overrides classpath:/application.properties)
spring.sql.init.data-locations=classpath:data.sql
# Flow engine: fast polling and retries so tests finish quickly
flows.poll-interval=100ms
flows.schedule-interval=1h
flows.retry-backoff=100ms
flows.mail.allowed-recipient-domains=example.com
flows.lease=4s
flows.light-slots=2
# Files in a local directory; the S3 path is covered by FlowPostgresClusterTest (Testcontainers)
storage.type=filesystem
flows.webhook.allowed-hosts=localhost,127.0.0.1
flows.kafka.enabled=false
storage.filesystem.directory=target/test-files
