# One container behind the web (nginx) container: docker-compose.yml. Every value can be overridden with environment
# variables (Spring maps DATASETS_..., SPRING_MAIL_HOST ... to the properties).
#
# Demo setup: H2 on a volume (survives restarts and redeploys) with the demo and example data, run files on the same
# volume. One instance only; for several instances use the postgres profile and an S3 bucket.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:/data/db/platform}
spring.flyway.locations=classpath:db/migration/{vendor},classpath:db/migration/common,classpath:db/seed/{vendor}/demo,classpath:db/seed/{vendor}/examples
spring.h2.console.enabled=false
logging.level.com.gucardev.entityreports=INFO

# behind nginx and the HTTPS proxy (Traefik in Dokploy): trust X-Forwarded-*, mark the session cookie Secure
server.forward-headers-strategy=framework
security.session-cookie.secure=${SESSION_COOKIE_SECURE:true}
security.demo-password=${DEMO_PASSWORD:password}

# links in approval e-mails
approvals.ui-base-url=${PUBLIC_URL:http://localhost:8088}

# run files on the volume, streamed through the app (no S3 needed)
storage.type=${STORAGE_TYPE:filesystem}
storage.filesystem.directory=${STORAGE_DIRECTORY:/data/files}

spring.mail.host=${MAIL_HOST:mailpit}
spring.mail.port=${MAIL_PORT:1025}
notifications.mail.from=${MAIL_FROM:veri-akis@localhost}

flows.kafka.enabled=${FLOWS_KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
