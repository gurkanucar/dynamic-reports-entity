# PostgreSQL for the performance test (see perf/README.md).
#   docker compose -f perf/compose.yaml up -d
services:
  postgres:
    image: postgres:17
    container_name: reports-postgres
    environment:
      POSTGRES_DB: reports
      POSTGRES_USER: reports
      POSTGRES_PASSWORD: reports
    ports:
      - "5433:5432"
    # Modest production-like settings; pg_stat_statements shows what the reports cost in the database.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - effective_cache_size=3GB
      - -c
      - random_page_cost=1.1
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
    # parallel hash joins of many concurrent reports live in /dev/shm; 1g ran out under 16 users
    shm_size: 4g
    volumes:
      - reports-pgdata:/var/lib/postgresql/data

volumes:
  reports-pgdata:
