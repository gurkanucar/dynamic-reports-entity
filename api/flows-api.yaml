openapi: 3.1.0
info:
  title: Flows API
  version: 1.0.0
  description: |
    Business users chain steps (run a report, e-mail it) and start them by hand or on a cron schedule.

    * Success bodies use the `{ "data": ..., "meta": ... }` envelope; errors are RFC 9457 problems with a
      stable `code` and a `traceId` (catalog: `errors.yaml`).
    * Enums are snake_case, times ISO 8601 UTC, pages 1-based (`size` 1-100, default 20).
    * Changing a flow, schedule or template needs its ETag in `If-Match` (428 without, 412 if stale).
    * Every operation needs the `REPORT_RUN` authority. Users see their own flows; `REPORT_ADMIN` sees all.
      Records you may not see answer 404.
    * Runs execute **as the flow owner**: their report field and row permissions apply, looked up when the
      step runs.
servers:
  - url: /
security:
  - basicAuth: []

tags:
  - name: flows
  - name: runs
  - name: schedules
  - name: mail-templates

paths:
  /api/flows:
    get:
      tags: [flows]
      operationId: listFlows
      summary: List flows
      description: Own flows (all for REPORT_ADMIN), sorted by `-updatedAt,-id`.
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200':
          description: A page of flows.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/FlowSummary' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [flows]
      operationId: createFlow
      summary: Create a flow
      description: |
        The whole flow is checked: report definitions are built (not run) for the editor, templates must exist,
        recipients must be in `flows.mail.allowed-recipient-domains`, attachments must name earlier report steps.
        422 codes in `errors[]`: DUPLICATE_STEP_KEY, INVALID_REPORT_DEFINITION, MAX_ROWS_TOO_HIGH,
        TEMPLATE_NOT_FOUND, RECIPIENT_NOT_ALLOWED, UNKNOWN_ATTACHMENT and the field rules.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlowRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location: { schema: { type: string }, example: /api/flows/12 }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/flows/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [flows]
      operationId: getFlow
      summary: Get a flow
      responses:
        '200':
          description: The flow.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [flows]
      operationId: replaceFlow
      summary: Replace a flow
      description: Name, description and steps are replaced. Running runs keep their own copy of the steps.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlowRequest' }
      responses:
        '200':
          description: Saved.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [flows]
      operationId: deleteFlow
      summary: Delete a flow
      description: Deletes its schedules too; finished runs stay as history. 409 FLOW_HAS_ACTIVE_RUNS.
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/flows/{id}/runs:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [runs]
      operationId: startRun
      summary: Start a run
      description: |
        Queues a run and answers at once; follow `Location`. Manual runs go before scheduled ones. Never rejected
        for load: runs wait in the queue until an instance has a free slot.
      responses:
        '202':
          description: Queued.
          headers:
            Location: { schema: { type: string }, example: /api/flow-runs/91 }
            Retry-After: { schema: { type: integer }, example: 2 }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/RunSummary' } }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [runs]
      operationId: listFlowRuns
      summary: List the runs of a flow
      description: Newest first (`-createdAt,-id`).
      parameters:
        - { $ref: '#/components/parameters/Status' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { $ref: '#/components/responses/RunPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/flows/{id}/schedules:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [schedules]
      operationId: listSchedules
      summary: List the schedules of a flow
      description: At most `flows.max-schedules-per-flow` (10), so not paged.
      responses:
        '200':
          description: The schedules.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Schedule' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [schedules]
      operationId: createSchedule
      summary: Add a schedule
      description: |
        422 codes: INVALID_CRON, INVALID_TIME_ZONE, CRON_NEVER_FIRES, SCHEDULE_TOO_FREQUENT.
        409 SCHEDULE_LIMIT_REACHED. If the previous run is still active at a fire time, that fire time is
        skipped (`lastSkipReason`). Fire times missed while no instance ran fire once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location: { schema: { type: string }, example: /api/flow-schedules/7 }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/flow-schedules/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [schedules]
      operationId: getSchedule
      summary: Get a schedule
      responses:
        '200':
          description: The schedule.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [schedules]
      operationId: replaceSchedule
      summary: Replace a schedule
      description: Firing changes the version too (lastFiredAt); reload on 412.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleRequest' }
      responses:
        '200':
          description: Saved.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [schedules]
      operationId: deleteSchedule
      summary: Delete a schedule
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/flows/{id}/triggers:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [triggers]
      operationId: listTriggers
      summary: List the webhook and Kafka triggers of a flow
      description: At most 10 per flow, so not paged. Secrets are never listed.
      responses:
        '200':
          description: The triggers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Trigger' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [triggers]
      operationId: createTrigger
      summary: Add a trigger
      description: |
        A webhook trigger gets a random URL and an HMAC secret, returned only in this answer (and on rotate-secret).
        422 codes: REQUIRED (topic), TOPIC_NOT_ALLOWED, KAFKA_DISABLED, INVALID_EXPRESSION. 409 TRIGGER_LIMIT_REACHED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location: { schema: { type: string }, example: /api/flow-triggers/4 }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/TriggerWithSecret' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/flow-triggers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [triggers]
      operationId: getTrigger
      summary: Get a trigger
      responses:
        '200':
          description: The trigger.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [triggers]
      operationId: replaceTrigger
      summary: Replace a trigger (enable/disable, topic, filter)
      description: The type cannot change (422 TRIGGER_TYPE_FIXED). Firing does not change the version.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerRequest' }
      responses:
        '200':
          description: Saved.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [triggers]
      operationId: deleteTrigger
      summary: Delete a trigger
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/flow-triggers/{id}/rotate-secret:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [triggers]
      operationId: rotateTriggerSecret
      summary: Issue a new webhook secret
      description: The old secret stops working at once. 409 NOT_A_WEBHOOK for Kafka triggers.
      responses:
        '200':
          description: The new secret (shown only now).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/TriggerWithSecret' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/flow-hooks/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string }, description: From the trigger's webhookUrl. }
    post:
      tags: [triggers]
      operationId: receiveWebhook
      summary: Start a flow from another system
      description: |
        No session or Basic auth: the caller proves itself with `X-Signature: sha256=<hex HMAC-SHA256 of the raw body
        with the trigger secret>`. The JSON body becomes `trigger` in rules and templates. With `X-Event-Id`, a repeated
        event starts nothing (answer `duplicate`). A trigger filter that does not match answers `filtered`.
      security: []
      parameters:
        - { name: X-Signature, in: header, required: true, schema: { type: string, example: 'sha256=9f86d0...' } }
        - { name: X-Event-Id, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202':
          description: A run was started.
          headers:
            Location: { schema: { type: string }, example: /api/flow-runs/12 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryEnvelope' }
        '200':
          description: Accepted without a run (filtered or duplicate).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 'INVALID_SIGNATURE.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/approval-groups:
    get:
      tags: [approvals]
      operationId: listApprovalGroups
      summary: List approval groups
      description: Everyone may read them (to pick one for an approval step). Not paged.
      responses:
        '200':
          description: The groups.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ApprovalGroup' } }
    post:
      tags: [approvals]
      operationId: createApprovalGroup
      summary: Create an approval group (REPORT_ADMIN)
      description: 422 codes UNKNOWN_USER, DUPLICATE_MEMBER, INVALID_EMAIL. 409 GROUP_NAME_TAKEN.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalGroupRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location: { schema: { type: string }, example: /api/approval-groups/2 }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalGroupEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/approval-groups/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [approvals]
      operationId: getApprovalGroup
      summary: Get an approval group
      responses:
        '200':
          description: The group.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalGroupEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [approvals]
      operationId: replaceApprovalGroup
      summary: Replace an approval group (REPORT_ADMIN)
      description: Pending requests are decided by the members at decision time.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalGroupRequest' }
      responses:
        '200':
          description: Saved.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalGroupEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [approvals]
      operationId: deleteApprovalGroup
      summary: Delete an approval group (REPORT_ADMIN)
      description: 409 GROUP_IN_USE while a flow's approval step refers to it.
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/approval-requests:
    get:
      tags: [approvals]
      operationId: listApprovalRequests
      summary: List approval requests
      description: Newest first. `scope=mine` (default) lists the requests of my groups; `all` is for REPORT_ADMIN.
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [mine, all], default: mine } }
        - name: status
          in: query
          description: Repeat for several (OR).
          schema: { type: array, items: { $ref: '#/components/schemas/ApprovalStatus' } }
          style: form
          explode: true
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: A page of requests.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ApprovalRequest' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/approval-requests/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [approvals]
      operationId: getApprovalRequest
      summary: Get an approval request
      description: Visible to group members, the requester and REPORT_ADMIN; 404 otherwise.
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequestEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/approval-requests/{id}/approve:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [approvals]
      operationId: approveRequest
      summary: Approve; the run continues on the step's `approved` edge
      description: &decide |
        403 NOT_APPROVER (not in the group), SELF_APPROVAL_FORBIDDEN (started the run). 409 APPROVAL_ALREADY_DECIDED,
        APPROVAL_NOT_READY (the step is not waiting yet; retry). Decisions are serialised per run, so two
        approvers clicking at once get one success and one 409.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Decided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequestEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/approval-requests/{id}/reject:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [approvals]
      operationId: rejectRequest
      summary: Reject; the run continues on the step's `rejected` edge (or ends)
      description: *decide
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Decided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequestEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/flow-runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: List runs of every visible flow
      description: Newest first. Users see runs that act as them; REPORT_ADMIN sees all.
      parameters:
        - { $ref: '#/components/parameters/Status' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { $ref: '#/components/responses/RunPage' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/flow-runs/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [runs]
      operationId: getRun
      summary: Get a run with its steps, files and history
      description: While the run is queued or running, `Retry-After` suggests when to ask again.
      responses:
        '200':
          description: The run.
          headers:
            Retry-After: { schema: { type: integer }, description: Only while the run is active. }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/RunDetail' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/flow-runs/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Cancel a run
      description: |
        Waiting steps are cancelled at once. A running step is stopped within seconds: its database query is
        cancelled (`Statement.cancel()`), other work is interrupted; then the run becomes `cancelled`.
        Cancelling twice is harmless while the run is active; 409 RUN_ALREADY_FINISHED afterwards.
      responses:
        '200':
          description: Cancel requested (`cancelRequested` true) or already done (`status` cancelled).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/RunSummary' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/flow-files/{id}/download:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [runs]
      operationId: downloadFile
      summary: Download a file produced by a run
      description: |
        Redirects to a presigned URL of the object store valid for `storage.s3.presigned-url-ttl` (the bytes do not
        pass through the app). Streamed instead when the store offers no presigned URLs. Files are deleted
        `flows.file-retention` after they were made: 410 FILE_EXPIRED afterwards.
      responses:
        '302':
          description: Download from the object store.
          headers:
            Location: { schema: { type: string, format: uri } }
        '200':
          description: The file (CSV, UTF-8 with BOM), when not redirected.
          content:
            text/csv: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

  /api/flow-files/{id}/download-link:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [runs]
      operationId: getFileDownloadLink
      summary: Presigned download URL as JSON
      description: |
        For browser apps that send credentials in a header and therefore cannot follow the redirect of
        `/download` to the object store. `url` is null when the store offers no presigned URLs; then GET
        `/download`, which streams the file.
      responses:
        '200':
          description: The link.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url, fileName]
                    properties:
                      url: { type: [string, 'null'], format: uri }
                      fileName: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

  /api/mail-templates:
    get:
      tags: [mail-templates]
      operationId: listMailTemplates
      summary: List mail templates
      description: Every user may use every template. Sorted by `name,id`.
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200':
          description: A page of templates.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TemplateSummary' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [mail-templates]
      operationId: createMailTemplate
      summary: Create a mail template
      description: 422 TEMPLATE_SYNTAX_ERROR (subject or bodyHtml); 409 TEMPLATE_NAME_TAKEN.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location: { schema: { type: string } }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/mail-templates/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [mail-templates]
      operationId: getMailTemplate
      summary: Get a mail template
      responses:
        '200':
          description: The template.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [mail-templates]
      operationId: replaceMailTemplate
      summary: Replace a mail template
      description: Owner or REPORT_ADMIN only (403 NOT_TEMPLATE_OWNER).
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateRequest' }
      responses:
        '200':
          description: Saved.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [mail-templates]
      operationId: deleteMailTemplate
      summary: Delete a mail template
      description: Owner or REPORT_ADMIN only; 409 TEMPLATE_IN_USE while a flow uses it.
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/mail-template-previews:
    post:
      tags: [mail-templates]
      operationId: previewMailTemplate
      summary: Render a draft template
      description: Nothing is saved. Without `model`, the sample model (`GET .../sample-model`) is used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, bodyHtml]
              properties:
                subject: { type: string, maxLength: 500 }
                bodyHtml: { type: string, maxLength: 200000 }
                model: { type: [object, 'null'], additionalProperties: true }
      responses:
        '200':
          description: Rendered subject (plain text) and body (values HTML-escaped).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [subject, bodyHtml]
                    properties: { subject: { type: string }, bodyHtml: { type: string } }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/mail-template-previews/sample-model:
    get:
      tags: [mail-templates]
      operationId: getSampleTemplateModel
      summary: What a template can use
      description: |
        `flow.{id,name}`, `run.{id,trigger,triggeredBy,startedAt,date}` and `steps.<key>` = the outputs of the
        earlier steps. A report step's output: `rowCount`, `hasRows`, `fileName`, `columns[]`,
        `rows[].cells[]` (first `flows.preview-rows` rows), `previewTruncated`.
      responses:
        '200':
          description: The sample model.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { type: object, additionalProperties: true } }

components:
  securitySchemes:
    basicAuth: { type: http, scheme: basic }

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Status:
      name: status
      in: query
      description: Repeat for several (OR).
      schema: { type: array, items: { $ref: '#/components/schemas/RunStatus' } }
      style: form
      explode: true
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag of the version being edited.
      schema: { type: string, example: '"3"' }

  headers:
    ETag: { schema: { type: string }, example: '"3"' }

  responses:
    BadRequest: { description: 'Malformed request.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: 'Not allowed.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: 'Missing or not visible.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: 'The current state does not allow it.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    PreconditionFailed: { description: 'Stale If-Match (VERSION_MISMATCH).', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unprocessable: { description: 'Validation failed; see errors[].', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    PreconditionRequired: { description: 'If-Match missing (IF_MATCH_REQUIRED).', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Gone: { description: 'No longer available (FILE_EXPIRED).', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    RunPage:
      description: A page of runs.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/RunSummary' } }
              meta: { $ref: '#/components/schemas/PageMeta' }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { type: string, description: See errors.yaml. }
        detail: { type: [string, 'null'] }
        instance: { type: string }
        traceId: { type: string, description: Same as the X-Request-Id header when one is sent. }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string, example: 'steps[1].to[0]' }
              code: { type: string }
              message: { type: string }

    PageMeta:
      type: object
      required: [page, size, totalItems, totalPages]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }

    UserRef:
      type: object
      required: [username]
      properties: { username: { type: string } }

    StepKey: { type: string, pattern: '^[a-z][a-z0-9_]{0,39}$' }

    ReportStep:
      type: object
      description: |
        Runs a report (same definition as `/api/reports/run`) as the flow owner and stores it as CSV.
      required: [type, key, definition]
      properties:
        type: { const: report }
        key: { $ref: '#/components/schemas/StepKey' }
        definition: { type: object, description: 'ReportDefinition: root, columns, where, having, sort, perRoot.' }
        fileName: { type: [string, 'null'], maxLength: 100, pattern: '^[\w .-]+\.csv$', description: 'Default <key>.csv' }
        maxRows: { type: [integer, 'null'], minimum: 1, description: Fail above this; at most flows.report-max-rows. }
        timeoutSeconds: { type: [integer, 'null'], minimum: 1, maximum: 3600, description: Default flows.report-timeout. }
        maxAttempts: { type: [integer, 'null'], minimum: 1, maximum: 10, description: Default flows.max-attempts. }

    MailStep:
      type: object
      description: Sends an e-mail from a template; sent at most once per step run (at least once on a crash).
      required: [type, key, templateId, to]
      properties:
        type: { const: mail }
        key: { $ref: '#/components/schemas/StepKey' }
        templateId: { type: integer, format: int64 }
        to: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: email } }
        cc: { type: array, maxItems: 50, items: { type: string, format: email } }
        attachments: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/StepKey' }, description: Earlier report steps. }
        timeoutSeconds: { type: [integer, 'null'], minimum: 1, maximum: 600 }
        maxAttempts: { type: [integer, 'null'], minimum: 1, maximum: 10 }

    ConditionStep:
      type: object
      description: Evaluates a JSON Logic rule over the run data; outcome `true` or `false`.
      required: [type, key, expression]
      properties:
        type: { const: condition }
        key: { $ref: '#/components/schemas/StepKey' }
        expression: { $ref: '#/components/schemas/JsonLogic' }

    FilterStep:
      type: object
      description: Keeps the items of a list (`source` path) matching the rule (each item as `item`). Output items, count.
      required: [type, key, source, expression]
      properties:
        type: { const: filter }
        key: { $ref: '#/components/schemas/StepKey' }
        source: { type: string, maxLength: 200, examples: [trigger.orders, steps.fetch.body.items] }
        expression: { $ref: '#/components/schemas/JsonLogic' }

    ApprovalStep:
      type: object
      description: |
        Waits (no worker is held) for one member of the group to decide. Outcomes approved, rejected, timeout.
        Without an edge for its outcome, anything but `approved` ends the run.
      required: [type, key, groupId, title]
      properties:
        type: { const: approval }
        key: { $ref: '#/components/schemas/StepKey' }
        groupId: { type: integer, format: int64 }
        title: { type: string, maxLength: 200, description: Mustache over the run data. }
        description: { type: [string, 'null'], maxLength: 4000, description: Mustache over the run data. }
        timeoutHours: { type: [integer, 'null'], minimum: 1, maximum: 720, default: 72 }
        allowSelfApproval: { type: [boolean, 'null'], default: false }
        notifyMembers: { type: [boolean, 'null'], default: true, description: E-mail members with an e-mail address. }

    WebhookStep:
      type: object
      description: |
        Calls an HTTP endpoint on a host in flows.webhook.allowed-hosts; redirects are not followed. The body is a
        Mustache template whose values are JSON-escaped. 408, 429 and 5xx are retried. Output status and body.
      required: [type, key, url]
      properties:
        type: { const: webhook }
        key: { $ref: '#/components/schemas/StepKey' }
        url: { type: string, format: uri, maxLength: 2000 }
        method: { type: [string, 'null'], enum: [GET, POST, PUT, PATCH, DELETE, null], default: POST }
        headers: { type: object, additionalProperties: { type: string } }
        body: { type: [string, 'null'], maxLength: 20000 }
        contentType: { type: [string, 'null'], default: application/json }
        timeoutSeconds: { type: [integer, 'null'], minimum: 1, maximum: 120 }
        maxAttempts: { type: [integer, 'null'], minimum: 1, maximum: 10 }

    KafkaPublishStep:
      type: object
      description: |
        Publishes a message (Mustache, JSON-escaped) to a topic in flows.kafka.allowed-topics, with headers flow-run-id
        and flow-step. At least once: consumers should de-duplicate on those headers.
      required: [type, key, topic, payload]
      properties:
        type: { const: kafka }
        key: { $ref: '#/components/schemas/StepKey' }
        topic: { type: string, maxLength: 249 }
        messageKey: { type: [string, 'null'], maxLength: 500 }
        payload: { type: string, maxLength: 100000 }

    JsonLogic:
      description: 'A JSON Logic rule (jsonlogic.com), e.g. {">": [{"var": "trigger.amount"}, 100]}. Supported operators only.'

    FlowEdge:
      type: object
      required: [from, to]
      properties:
        from: { $ref: '#/components/schemas/StepKey' }
        to: { $ref: '#/components/schemas/StepKey' }
        when:
          type: [string, 'null']
          description: The outcome of `from` this edge is taken on (true/false, approved/rejected/timeout); null = otherwise.

    FlowStep:
      oneOf:
        - { $ref: '#/components/schemas/ReportStep' }
        - { $ref: '#/components/schemas/MailStep' }
        - { $ref: '#/components/schemas/ConditionStep' }
        - { $ref: '#/components/schemas/FilterStep' }
        - { $ref: '#/components/schemas/ApprovalStep' }
        - { $ref: '#/components/schemas/WebhookStep' }
        - { $ref: '#/components/schemas/KafkaPublishStep' }
      discriminator:
        propertyName: type
        mapping:
          report: '#/components/schemas/ReportStep'
          mail: '#/components/schemas/MailStep'
          condition: '#/components/schemas/ConditionStep'
          filter: '#/components/schemas/FilterStep'
          approval: '#/components/schemas/ApprovalStep'
          webhook: '#/components/schemas/WebhookStep'
          kafka: '#/components/schemas/KafkaPublishStep'

    FlowRequest:
      type: object
      required: [name, steps]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 1000 }
        steps: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/FlowStep' } }
        edges:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/FlowEdge' }
          description: |
            Empty: steps run in list order. Otherwise a DAG with one start step; each step continues on the edge for
            its outcome, else on its edge with `when: null`, else the run ends. 422 codes: EDGE_UNKNOWN_STEP, CYCLE,
            DUPLICATE_EDGE, INVALID_EDGE_OUTCOME, NO_START_STEP, MULTIPLE_START_STEPS, UNREACHABLE_STEP.
        layout:
          type: object
          description: Canvas positions by step key (UI only).
          additionalProperties: { $ref: '#/components/schemas/Position' }

    FlowSummary:
      type: object
      required: [id, name, description, owner, stepCount, version, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, 'null'] }
        owner: { $ref: '#/components/schemas/UserRef' }
        stepCount: { type: integer }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FlowEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, name, description, owner, steps, version, createdAt, updatedAt, updatedBy]
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            description: { type: [string, 'null'] }
            owner: { $ref: '#/components/schemas/UserRef' }
            steps: { type: array, items: { $ref: '#/components/schemas/FlowStep' } }
            edges: { type: array, items: { $ref: '#/components/schemas/FlowEdge' } }
            layout: { type: object, additionalProperties: { $ref: '#/components/schemas/Position' } }
            version: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            updatedBy: { $ref: '#/components/schemas/UserRef' }

    ScheduleRequest:
      type: object
      required: [cron, timeZone, enabled]
      properties:
        cron: { type: string, maxLength: 100, examples: ['0 8 * * MON-FRI', '@daily', '0 30 6 1 * *'] }
        timeZone: { type: string, maxLength: 60, examples: [Europe/Istanbul] }
        enabled: { type: boolean }

    Schedule:
      type: object
      required: [id, flowId, cron, timeZone, enabled, nextFireAt, lastFiredAt, lastRunId, lastSkipReason, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        flowId: { type: integer, format: int64 }
        cron: { type: string }
        timeZone: { type: string }
        enabled: { type: boolean }
        nextFireAt: { type: [string, 'null'], format: date-time, description: Null while disabled. }
        lastFiredAt: { type: [string, 'null'], format: date-time }
        lastRunId: { type: [integer, 'null'], format: int64 }
        lastSkipReason: { type: [string, 'null'] }
        version: { type: integer, format: int64 }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ScheduleEnvelope:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/Schedule' } }

    RunStatus: { type: string, enum: [queued, running, completed, failed, cancelled] }

    ErrorInfo:
      type: [object, 'null']
      required: [code, message]
      properties:
        code: { type: string, description: 'Step codes in errors.yaml (step:).' }
        message: { type: string }

    RunSummary:
      type: object
      required: [id, flow, status, cancelRequested, trigger, triggeredBy, runAs, scheduleId, createdAt, startedAt, finishedAt, error]
      properties:
        id: { type: integer, format: int64 }
        flow:
          type: object
          required: [id, name]
          properties: { id: { type: integer, format: int64 }, name: { type: string } }
        status: { $ref: '#/components/schemas/RunStatus' }
        cancelRequested: { type: boolean }
        trigger: { type: string, enum: [manual, schedule, webhook, kafka] }
        triggeredBy: { type: string, description: 'Username, schedule:<id>, webhook:<id> or kafka:<id>.' }
        runAs: { $ref: '#/components/schemas/UserRef' }
        scheduleId: { type: [integer, 'null'], format: int64 }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        error: { $ref: '#/components/schemas/ErrorInfo' }

    RunDetail:
      allOf:
        - { $ref: '#/components/schemas/RunSummary' }
        - type: object
          required: [steps, files, events, triggerPayload, definition]
          properties:
            triggerPayload: { description: 'The webhook body or Kafka message ({key, value, headers, topic, ...}); null otherwise.' }
            definition:
              type: object
              description: The flow as this run executes it (a copy taken when the run started).
              required: [steps, edges, layout]
              properties:
                steps: { type: array, items: { $ref: '#/components/schemas/FlowStep' } }
                edges: { type: array, items: { $ref: '#/components/schemas/FlowEdge' } }
                layout: { type: object, additionalProperties: { $ref: '#/components/schemas/Position' } }
            steps:
              type: array
              items:
                type: object
                required: [key, type, status, outcome, attempt, maxAttempts, timeoutSeconds, startedAt, finishedAt, nextAttemptAt, waitingUntil, error, output]
                properties:
                  key: { type: string }
                  type: { type: string, enum: [report, mail, condition, filter, approval, webhook, kafka] }
                  status: { type: string, enum: [ready, running, waiting, completed, failed, cancelled] }
                  outcome: { type: [string, 'null'], description: 'Which edge was taken: true/false, approved/rejected/timeout.' }
                  attempt: { type: integer }
                  maxAttempts: { type: integer }
                  timeoutSeconds: { type: integer }
                  startedAt: { type: [string, 'null'], format: date-time }
                  finishedAt: { type: [string, 'null'], format: date-time }
                  nextAttemptAt: { type: [string, 'null'], format: date-time, description: Set while waiting for a retry. }
                  waitingUntil: { type: [string, 'null'], format: date-time, description: Set while an approval waits. }
                  error: { $ref: '#/components/schemas/ErrorInfo' }
                  output: { type: [object, 'null'], additionalProperties: true }
            files:
              type: array
              items:
                type: object
                required: [id, stepKey, fileName, sizeBytes, expiresAt, expired, downloadUrl]
                properties:
                  id: { type: integer, format: int64 }
                  stepKey: { type: string }
                  fileName: { type: string }
                  sizeBytes: { type: integer, format: int64 }
                  expiresAt: { type: string, format: date-time, description: Deleted from storage after this. }
                  expired: { type: boolean }
                  downloadUrl: { type: [string, 'null'], example: /api/flow-files/5/download, description: Null once expired. }
            events:
              type: array
              description: Append-only history, oldest first.
              items:
                type: object
                required: [id, type, stepKey, message, occurredAt]
                properties:
                  id: { type: integer, format: int64 }
                  type:
                    type: string
                    description: >-
                      run_queued, step_started, step_completed, step_retry_scheduled, step_released, step_failed,
                      step_cancelled, step_waiting, approval_approved, approval_rejected, approval_timed_out,
                      cancel_requested, run_completed, run_failed, run_cancelled
                  stepKey: { type: [string, 'null'] }
                  message: { type: [string, 'null'] }
                  occurredAt: { type: string, format: date-time }

    Position:
      type: object
      required: [x, y]
      properties: { x: { type: number }, y: { type: number } }

    TriggerRequest:
      type: object
      required: [type, enabled]
      properties:
        type: { type: string, enum: [webhook, kafka] }
        enabled: { type: boolean }
        topic: { type: [string, 'null'], maxLength: 249, description: Required for kafka. }
        filter:
          description: Optional JSON Logic rule over the message (as `trigger`); messages that do not match start nothing.

    Trigger:
      type: object
      required: [id, flowId, type, enabled, topic, filter, webhookUrl, lastFiredAt, lastRunId, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        flowId: { type: integer, format: int64 }
        type: { type: string, enum: [webhook, kafka] }
        enabled: { type: boolean }
        topic: { type: [string, 'null'] }
        filter: { description: JSON Logic or null. }
        webhookUrl: { type: [string, 'null'], example: /api/flow-hooks/vetBFMiz..., description: Path to POST to (webhook). }
        lastFiredAt: { type: [string, 'null'], format: date-time }
        lastRunId: { type: [integer, 'null'], format: int64 }
        version: { type: integer, format: int64 }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TriggerEnvelope:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/Trigger' } }

    TriggerWithSecret:
      type: object
      required: [trigger, secret]
      properties:
        trigger: { $ref: '#/components/schemas/Trigger' }
        secret: { type: [string, 'null'], description: HMAC key for X-Signature; shown only once. }

    DeliveryEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, runId]
          properties:
            status: { type: string, enum: [started, filtered, duplicate] }
            runId: { type: [integer, 'null'], format: int64 }

    GroupMember:
      type: object
      required: [username]
      properties:
        username: { type: string, maxLength: 100 }
        email: { type: [string, 'null'], format: email }

    ApprovalGroupRequest:
      type: object
      required: [name, members]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 500 }
        members: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/GroupMember' } }

    ApprovalGroup:
      type: object
      required: [id, name, description, members, version, updatedAt, updatedBy]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, 'null'] }
        members: { type: array, items: { $ref: '#/components/schemas/GroupMember' } }
        version: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/UserRef' }

    ApprovalGroupEnvelope:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/ApprovalGroup' } }

    ApprovalStatus: { type: string, enum: [pending, approved, rejected, timed_out, cancelled] }

    DecisionRequest:
      type: object
      properties:
        comment: { type: [string, 'null'], maxLength: 1000 }

    ApprovalRequest:
      type: object
      required: [id, runId, flow, stepKey, group, title, description, status, requestedBy, runAs, createdAt, dueAt, decidedBy, decidedAt, comment, canDecide]
      properties:
        id: { type: integer, format: int64 }
        runId: { type: integer, format: int64 }
        flow:
          type: object
          required: [id, name]
          properties: { id: { type: integer, format: int64 }, name: { type: string } }
        stepKey: { type: string }
        group:
          type: object
          required: [id, name]
          properties: { id: { type: integer, format: int64 }, name: { type: string } }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        requestedBy: { type: string, description: 'Who started the run (username, webhook:<id>, ...).' }
        runAs: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        comment: { type: [string, 'null'] }
        canDecide: { type: boolean, description: The current user may approve or reject it now. }

    ApprovalRequestEnvelope:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/ApprovalRequest' } }

    TemplateRequest:
      type: object
      required: [name, subject, bodyHtml]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 1000 }
        subject: { type: string, maxLength: 500, description: Mustache, rendered as plain text. }
        bodyHtml: { type: string, maxLength: 200000, description: 'Mustache; values are HTML-escaped, no partials, no code.' }

    TemplateSummary:
      type: object
      required: [id, name, description, owner, version, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, 'null'] }
        owner: { $ref: '#/components/schemas/UserRef' }
        version: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }

    TemplateEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, name, description, subject, bodyHtml, owner, version, createdAt, updatedAt, updatedBy]
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            description: { type: [string, 'null'] }
            subject: { type: string }
            bodyHtml: { type: string }
            owner: { $ref: '#/components/schemas/UserRef' }
            version: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            updatedBy: { $ref: '#/components/schemas/UserRef' }
