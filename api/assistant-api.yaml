openapi: 3.1.0
info:
  title: Dataset assistant and session API
  version: 1.0.0
  description: |
    **Dataset assistant** (`/api/dataset-suggestions`): a business user describes a dataset in plain language; an LLM
    (any OpenAI-compatible API, e.g. OpenRouter) builds a dataset definition that our dataset builder has validated as
    that user. Only the user's messages and the catalog *metadata* they may use leave the company, never data rows.
    Asynchronous (docs/REST API Tasarım Rehberi.md, 10): POST answers 202, then GET until `completed` or `failed`.

    **Session** (`/api/session`): browser login. The session cookie `PLATFORM_SESSION` is HttpOnly, SameSite=Lax and
    stored in the database (any instance serves it). Requests on a session that change something must send the
    `XSRF-TOKEN` cookie's value as `X-XSRF-TOKEN`. API clients may keep using HTTP Basic (no session, no token).

    Conventions as in `flows-api.yaml`: `{data, meta}` envelope, RFC 9457 problems with `code` and `traceId`,
    snake_case enums, ISO 8601 UTC times.
servers:
  - url: /
security:
  - session: []
  - basicAuth: []

paths:
  /api/session:
    post:
      tags: [session]
      operationId: login
      summary: Log in (browser)
      security: []
      description: Starts a new session (new id, against session fixation). 401 INVALID_CREDENTIALS for unknown
        users and wrong passwords alike.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 100 }
                password: { type: string, maxLength: 200, format: password }
      responses:
        '201':
          description: Logged in; sets the `PLATFORM_SESSION` and `XSRF-TOKEN` cookies.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
    get:
      tags: [session]
      operationId: getSession
      summary: Who is logged in
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '401': { description: No valid session. }
    delete:
      tags: [session]
      operationId: logout
      summary: Log out
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: Session ended (removed from the store, so on every instance). }
        '403': { $ref: '#/components/responses/Problem' }

  /api/dataset-suggestions/settings:
    get:
      tags: [assistant]
      operationId: getAssistantSettings
      summary: Whether the assistant is available
      description: The UI hides the assistant when `enabled` is false (not configured, or switched off).
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [enabled, model, provider]
                    properties:
                      enabled: { type: boolean }
                      model: { type: [string, 'null'], examples: [z-ai/glm-5.3-flash] }
                      provider: { type: [string, 'null'], examples: [openrouter.ai] }

  /api/dataset-suggestions:
    post:
      tags: [assistant]
      operationId: requestSuggestion
      summary: Ask the assistant for a dataset
      description: |
        The model may call `validate_dataset` (our builder, as this user, nothing executed) as often as needed and
        must `submit_dataset` a definition that passes. A plain-text answer is a question back to the user.
        Errors: 503 ASSISTANT_DISABLED; 422 LAST_MESSAGE_NOT_FROM_USER, VALIDATION_FAILED.
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 30
                  description: The conversation so far; the last message is the user's request.
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string, minLength: 1, maxLength: 4000 }
                currentDefinition:
                  type: [object, 'null']
                  description: The definition on screen, also an unfinished draft; null for a new dataset.
      responses:
        '202':
          description: Accepted; follow `Location`.
          headers:
            Location: { schema: { type: string }, example: /api/dataset-suggestions/17 }
            Retry-After: { schema: { type: integer }, example: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestionEnvelope' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /api/dataset-suggestions/{id}:
    get:
      tags: [assistant]
      operationId: getSuggestion
      summary: Poll a suggestion
      description: Only the user who asked sees it (404 SUGGESTION_NOT_FOUND for others). Kept for
        `assistant.retention`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: The suggestion; `Retry-After` while it is still being worked on.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestionEnvelope' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/mail-template-suggestions:
    post:
      tags: [assistant]
      operationId: requestMailTemplateSuggestion
      summary: Ask the assistant for a mail template
      description: |
        Same request/poll pattern and body as `/api/dataset-suggestions`, with `current` = the template on screen
        (`{name, subject, bodyHtml}`). The model renders its draft with sample data (`preview_template`) until it
        compiles. The reply's `draft` is `{name, description, subject, bodyHtml}`; nothing is saved.
        Poll `GET /api/mail-template-suggestions/{id}`.
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftSuggestionRequest' }
      responses:
        '202':
          description: Accepted; follow `Location`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestionEnvelope' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /api/flow-suggestions:
    post:
      tags: [assistant]
      operationId: requestFlowSuggestion
      summary: Ask the assistant for a flow draft
      description: |
        Same request/poll pattern as `/api/dataset-suggestions`, with `current` = the flow on screen
        (`{name, steps, edges, schedules}`). The model sees the user's catalog, saved datasets, mail templates and
        approval groups (names only) and must pass the same checks as `POST /api/flows` (`validate_flow`).
        The reply's `draft` is `{flow: {name, steps, edges}, schedules: [{cron, timeZone}],
        newTemplates: [{ref, name, subject, bodyHtml}]}`; a mail step may say `templateRef` instead of `templateId`
        for a template of `newTemplates`. Nothing is saved: the client creates the templates and the flow.
        Poll `GET /api/flow-suggestions/{id}`.
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftSuggestionRequest' }
      responses:
        '202':
          description: Accepted; follow `Location`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestionEnvelope' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /api/cron-suggestions:
    post:
      tags: [assistant]
      operationId: requestCronSuggestion
      summary: Turn a schedule in plain language into a cron expression
      description: |
        Same request/poll pattern as `/api/dataset-suggestions` ("her gece 3'te", `current` = `{cron}` on screen).
        The model checks its expression (`check_cron`: valid, five fields, at most every 5 minutes, next fire times
        in Europe/Istanbul). The reply's `draft` is `{cron, description}`. Poll `GET /api/cron-suggestions/{id}`.
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftSuggestionRequest' }
      responses:
        '202':
          description: Accepted; follow `Location`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestionEnvelope' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: PLATFORM_SESSION }
    basicAuth: { type: http, scheme: basic }

  parameters:
    Csrf:
      name: X-XSRF-TOKEN
      in: header
      required: false
      description: Required on a session (value of the XSRF-TOKEN cookie); not used with Basic auth.
      schema: { type: string }

  responses:
    Problem:
      description: RFC 9457 problem with `code` and `traceId` (see errors.yaml).
      content:
        application/problem+json:
          schema: { $ref: 'flows-api.yaml#/components/schemas/Problem' }

  schemas:
    SessionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [username, authorities]
          properties:
            username: { type: string }
            authorities: { type: array, items: { type: string }, examples: [[PLATFORM_USER, SALARY_VIEW]] }

    DraftSuggestionRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string, minLength: 1, maxLength: 4000 }
        current:
          type: [object, 'null']
          description: What is on screen (template or flow), also unfinished; null to start from scratch.
    SuggestionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, status, createdAt, finishedAt, model, reply, error]
          properties:
            id: { type: integer, format: int64 }
            status: { type: string, enum: [queued, processing, completed, failed] }
            createdAt: { type: string, format: date-time }
            finishedAt: { type: [string, 'null'], format: date-time }
            model: { type: [string, 'null'] }
            reply:
              type: [object, 'null']
              description: Set when completed. A dataset (definition not null) or only a message (a question).
              required: [message, title, explanation, definition, columns, draft]
              properties:
                message: { type: [string, 'null'] }
                title: { type: [string, 'null'] }
                explanation: { type: [string, 'null'] }
                definition:
                  type: [object, 'null']
                  description: Dataset definition (as POST /api/datasets/run) without null properties.
                columns:
                  type: array
                  items:
                    type: object
                    required: [label, type]
                    properties:
                      label: { type: string }
                      type: { type: string, enum: [TEXT, NUMBER, DATE, DATE_TIME, BOOLEAN] }
                draft:
                  type: [object, 'null']
                  description: Mail template and flow suggestions; see their endpoints.
            error:
              type: [object, 'null']
              required: [code, message]
              properties:
                code:
                  type: string
                  description: >-
                    ASSISTANT_GAVE_UP, ASSISTANT_UNAUTHORIZED, ASSISTANT_NO_CREDIT, ASSISTANT_RATE_LIMITED,
                    ASSISTANT_BAD_REQUEST, ASSISTANT_UNAVAILABLE, ASSISTANT_BAD_RESPONSE, SUGGESTION_TIMED_OUT,
                    INTERNAL_ERROR
                message: { type: string }
