# Error code catalog of the flow API (docs/REST API Tasarım Rehberi.md, section 6).
# A code never changes its meaning or status once published; new situations get new codes.
# "step" codes appear on runs (run.error.code, steps[].error.code), not as HTTP errors.

http:
  # ---- generic -------------------------------------------------------------------------------------
  MALFORMED_REQUEST:       { status: 400, message: "The request body is not valid JSON or a value has the wrong type." }
  UNKNOWN_STEP_TYPE:       { status: 400, message: "Unknown or missing step type." }
  INVALID_PARAMETER:       { status: 400, message: "Invalid query parameter value." }
  INVALID_PAGINATION:      { status: 400, message: "page must be >= 1 and size between 1 and 100." }
  INSUFFICIENT_ROLE:       { status: 403, message: "You are not allowed to do this." }
  VERSION_MISMATCH:        { status: 412, message: "The record was changed by someone else." }
  UNSUPPORTED_MEDIA_TYPE:  { status: 415, message: "Send the body as application/json." }
  VALIDATION_FAILED:       { status: 422, message: "One or more fields are invalid; see errors[]." }
  IF_MATCH_REQUIRED:       { status: 428, message: "Send the ETag in If-Match." }
  INTERNAL_ERROR:          { status: 500, message: "Unexpected error; quote the traceId." }
  # ---- flows ---------------------------------------------------------------------------------------
  FLOW_NOT_FOUND:          { status: 404, message: "The flow does not exist or is not yours." }
  DATASET_FIELD_FORBIDDEN:  { status: 403, message: "A dataset step uses a field you may not see." }
  FLOW_HAS_ACTIVE_RUNS:    { status: 409, message: "Cancel the queued or running runs first." }
  # ---- runs and files ------------------------------------------------------------------------------
  RUN_NOT_FOUND:           { status: 404, message: "The run does not exist or is not visible to you." }
  ARTIFACT_NOT_FOUND:      { status: 404, message: "The file does not exist or is not visible to you." }
  RUN_ALREADY_FINISHED:    { status: 409, message: "The run has already finished." }
  FILE_EXPIRED:            { status: 410, message: "The file was deleted after flows.file-retention." }
  FILE_NOT_VIEWABLE:       { status: 422, message: "Only text files up to 1 MB can be shown; download it instead." }
  # ---- saved datasets (/api/saved-datasets) --------------------------------------------------------
  SAVED_DATASET_NAME_TAKEN:   { status: 409, message: "Another saved dataset has this name." }
  SAVED_DATASET_IN_USE:       { status: 409, message: "A flow uses the dataset; change those flows first." }
  NOT_DATASET_OWNER:          { status: 403, message: "Only the owner or an admin may change or delete it." }
  INVALID_DATASET_DEFINITION: { status: 422, message: "The definition does not build (unknown field, bad aggregate ...)." }
  DATASET_ACCESS_DENIED:      { status: 403, message: "The definition uses a field you may not see." }
  # ---- schedules -----------------------------------------------------------------------------------
  SCHEDULE_NOT_FOUND:      { status: 404, message: "The schedule does not exist or is not visible to you." }
  SCHEDULE_LIMIT_REACHED:  { status: 409, message: "The flow already has the maximum number of schedules." }
  # ---- session and assistant ----------------------------------------------------------------------
  INVALID_CREDENTIALS:     { status: 401, message: "Wrong username or password." }
  ASSISTANT_DISABLED:      { status: 503, message: "The dataset assistant is not configured." }
  LAST_MESSAGE_NOT_FROM_USER: { status: 422, message: "The last message must be the user's request." }
  SUGGESTION_NOT_FOUND:    { status: 404, message: "The suggestion does not exist or is not yours." }
  # ---- mail templates ------------------------------------------------------------------------------
  TEMPLATE_NOT_FOUND:      { status: 404, message: "The mail template does not exist." }
  NOT_TEMPLATE_OWNER:      { status: 403, message: "Only the owner or a dataset admin may change the template." }
  TEMPLATE_NAME_TAKEN:     { status: 409, message: "Another template already has this name." }
  TEMPLATE_IN_USE:         { status: 409, message: "The template is used by a flow." }
  # ---- triggers ------------------------------------------------------------------------------------
  TRIGGER_NOT_FOUND:       { status: 404, message: "The trigger does not exist, or no active webhook has this address." }
  TRIGGER_LIMIT_REACHED:   { status: 409, message: "The flow already has the maximum number of triggers." }
  NOT_A_WEBHOOK:           { status: 409, message: "Only webhook triggers have a secret." }
  INVALID_SIGNATURE:       { status: 401, message: "X-Signature is missing or not the HMAC-SHA256 of the body." }
  PAYLOAD_TOO_LARGE:       { status: 400, message: "The webhook body is larger than flows.webhook.max-payload-size." }
  # ---- approvals -----------------------------------------------------------------------------------
  APPROVAL_GROUP_NOT_FOUND: { status: 404, message: "The approval group does not exist." }
  GROUP_NAME_TAKEN:        { status: 409, message: "Another approval group already has this name." }
  GROUP_IN_USE:            { status: 409, message: "A flow's approval step uses the group." }
  APPROVAL_NOT_FOUND:      { status: 404, message: "The approval request does not exist or is not visible to you." }
  NOT_APPROVER:            { status: 403, message: "You are not a member of the request's group." }
  SELF_APPROVAL_FORBIDDEN: { status: 403, message: "The person who started the run may not decide." }
  APPROVAL_ALREADY_DECIDED: { status: 409, message: "The request was already decided, timed out or cancelled." }

# Codes inside errors[] of a 422 VALIDATION_FAILED (field is a JSON path, e.g. steps[1].to[0])
field:
  REQUIRED: "Required."
  INVALID_LENGTH: "Too short or too long."
  INVALID_FORMAT: "Wrong format."
  INVALID_EMAIL: "Not an e-mail address."
  OUT_OF_RANGE: "Out of the allowed range."
  DUPLICATE_STEP_KEY: "Another step uses this key."
  INVALID_DATASET_DEFINITION: "The dataset cannot be built (unknown field, wrong operator, ...)."
  MAX_ROWS_TOO_HIGH: "maxRows is above flows.dataset-max-rows."
  TEMPLATE_NOT_FOUND: "The mail template does not exist."
  RECIPIENT_NOT_ALLOWED: "The address is outside flows.mail.allowed-recipient-domains."
  UNKNOWN_ATTACHMENT: "Not a dataset step before this one."
  TEMPLATE_SYNTAX_ERROR: "The Mustache template does not compile."
  INVALID_CRON: "Not a cron expression."
  INVALID_TIME_ZONE: "Not an IANA time zone."
  CRON_NEVER_FIRES: "The expression has no future fire time."
  SCHEDULE_TOO_FREQUENT: "Fires more often than flows.min-schedule-interval."
  INVALID_EXPRESSION: "Not a JSON Logic rule with supported operators."
  DATASET_SOURCE_REQUIRED: "A dataset step needs either a saved dataset (datasetName) or its own definition, not both."
  SAVED_DATASET_NOT_FOUND: "There is no saved dataset with this name."
  FILE_EXTENSION_MISMATCH: "The file name must end with the extension of the chosen format (.xlsx / .csv)."
  APPROVAL_GROUP_NOT_FOUND: "The approval group does not exist."
  INVALID_URL: "Not an absolute http(s) URL."
  WEBHOOK_HOST_NOT_ALLOWED: "The host is outside flows.webhook.allowed-hosts."
  KAFKA_DISABLED: "Kafka is not enabled (flows.kafka.enabled)."
  TOPIC_NOT_ALLOWED: "The topic is outside flows.kafka.allowed-topics."
  TRIGGER_TYPE_FIXED: "The type of a trigger cannot change."
  UNKNOWN_USER: "No such user."
  DUPLICATE_MEMBER: "The user is already a member."
  EDGE_UNKNOWN_STEP: "The edge refers to a step that does not exist."
  CYCLE: "The edges form a loop."
  DUPLICATE_EDGE: "The step already has an edge for this outcome."
  INVALID_EDGE_OUTCOME: "The step has no such outcome."
  NO_START_STEP: "Every step has an incoming edge."
  MULTIPLE_START_STEPS: "More than one step has no incoming edge."
  UNREACHABLE_STEP: "No path from the start step reaches this step."

# Codes on failed or retried steps (retry: whether another attempt is made while attempts are left)
step:
  INVALID_DATASET_DEFINITION: { retry: false, message: "The saved dataset no longer builds (e.g. a field was removed)." }
  INVALID_FLOW_DEFINITION:   { retry: false, message: "The stored flow definition cannot be read by this version." }
  DATASET_ACCESS_DENIED:      { retry: false, message: "The flow owner may no longer see a field or any rows." }
  RUN_AS_USER_UNAVAILABLE:   { retry: false, message: "The flow owner no longer exists or is disabled." }
  DATASET_FILE_TOO_LARGE:     { retry: false, message: "The CSV is larger than flows.max-artifact-size." }
  TEMPLATE_NOT_FOUND:        { retry: false, message: "The mail template was deleted." }
  RECIPIENT_NOT_ALLOWED:     { retry: false, message: "A recipient is outside the allowed domains." }
  ATTACHMENT_NOT_AVAILABLE:  { retry: false, message: "The dataset step to attach produced no file." }
  MAIL_RECIPIENT_REJECTED:   { retry: false, message: "The mail server rejected a recipient." }
  MAIL_REJECTED:             { retry: false, message: "The e-mail could not be built." }
  MAIL_SERVER_UNAVAILABLE:   { retry: true,  message: "The mail server could not be reached or refused the login." }
  STEP_TIMEOUT:              { retry: true,  message: "The step ran longer than its timeout." }
  STEP_LEASE_EXPIRED:        { retry: true,  message: "The instance running the step stopped responding." }
  STEP_INTERRUPTED:          { retry: true,  message: "The step was interrupted." }
  DATABASE_ERROR:            { retry: true,  message: "Database error; details in the server log." }
  INTERNAL_ERROR:            { retry: true,  message: "Unexpected error; details in the server log." }
  RUN_CANCELLED:             { retry: false, message: "The run was cancelled." }
  SAVED_DATASET_NOT_FOUND:   { retry: false, message: "The saved dataset the step uses was deleted." }
  STEP_TYPE_UNAVAILABLE:     { retry: false, message: "This instance cannot run the step type (e.g. Kafka disabled)." }
  EXPRESSION_FAILED:         { retry: false, message: "The rule could not be evaluated on this data." }
  FILTER_SOURCE_NOT_A_LIST:  { retry: false, message: "The filter's source is not a list." }
  FILTER_SOURCE_TOO_LARGE:   { retry: false, message: "The filter's source has more than 10000 items." }
  APPROVAL_GROUP_NOT_FOUND:  { retry: false, message: "The approval group was deleted." }
  APPROVAL_GROUP_EMPTY:      { retry: false, message: "The approval group has no members." }
  WEBHOOK_FAILED:            { retry: false, message: "The endpoint answered an error (408, 429 and 5xx are retried)." }
  WEBHOOK_TIMEOUT:           { retry: true,  message: "The endpoint did not answer in time." }
  WEBHOOK_UNREACHABLE:       { retry: true,  message: "The endpoint could not be reached." }
  WEBHOOK_HOST_NOT_ALLOWED:  { retry: false, message: "The rendered URL's host is not allowed." }
  KAFKA_UNAVAILABLE:         { retry: true,  message: "The broker did not acknowledge the message." }
