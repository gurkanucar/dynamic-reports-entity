# The scheme the browser used: from the HTTPS proxy in front (Traefik), else this connection's own
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # webhook bodies and Excel/CSV exports
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Traefik terminates HTTPS; keep the original scheme for Secure cookies
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # large exports stream; the assistant may take a while
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # hashed build files never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # single-page app: every other path is index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
